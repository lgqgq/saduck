<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--TITLE--> · SaDuck 考公知识库</title>
<meta name="description" content="<!--DESCRIPTION-->">
<meta name="keywords" content="<!--KEYWORDS-->">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bfd'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3E考%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="@@ASSETS@@/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="menu-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="@@HOME@@">
      <span class="brand-logo">考</span>
      <span class="brand-text"><strong>SaDuck</strong><small>考公知识库 · 陕西/西安考区</small></span>
    </a>
    <div class="search-wrap" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13.5 13.5L18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="搜索知识点…" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换主题">
      <svg class="icon-moon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M17 12.5A7 7 0 0 1 7.5 3 7 7 0 1 0 17 12.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.3 3.3l1.4 1.4M15.3 15.3l1.4 1.4M16.7 3.3l-1.4 1.4M4.7 15.3l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="nav" aria-label="站点导航">
      <!--SIDEBAR-->
    </nav>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <nav class="crumbs" aria-label="面包屑"><!--CRUMBS--></nav>
    <article class="article">
      <h1 class="article-title"><!--PAGE_TITLE--></h1>
      <!--CONTENT-->
    </article>

    <footer class="footer">
      <p><strong>SaDuck · 考公知识库</strong> — 面向陕西 / 西安考区的免费备考资料整理。</p>
      <p>本网站为学习参考用途整理，具体招考信息请以国家公务员局、陕西省公务员局、陕西省人力资源和社会保障厅及各招录单位官方公告为准。</p>
      <p class="footer-src">参考信息源：国家公务员局 / 陕西人事考试网 / 陕西省人民政府门户网站 / 各招录单位官网 / 公开媒体报道，更新于 2026 年 8 月。</p>
    </footer>
  </main>
</div>

<div class="mask" id="mask"></div>
<script>window.BASE = @@BASE@@;</script>
<script src="@@ASSETS@@/search-data.js"></script>
<script src="@@ASSETS@@/app.js"></script>
</body>
</html>
